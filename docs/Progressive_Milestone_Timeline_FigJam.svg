<svg id="timelineSVG" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 710" class="svg-container w-full h-auto drop-shadow-sm">
            <defs>
                <!-- Fonts & Styles -->
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
                    text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
                </style>

                <!-- Gradients -->
                <linearGradient id="gradPath1" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#3B82F6"/>
                    <stop offset="100%" stop-color="#10B981"/>
                </linearGradient>

                <linearGradient id="gradPath2" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#10B981"/>
                    <stop offset="100%" stop-color="#8B5CF6"/>
                </linearGradient>

                <!-- Card 1 Blue Gradient Header -->
                <linearGradient id="m1Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#EFF6FF"/>
                    <stop offset="100%" stop-color="#FFFFFF"/>
                </linearGradient>

                <!-- Card 2 Green Gradient Header -->
                <linearGradient id="m2Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ECFDF5"/>
                    <stop offset="100%" stop-color="#FFFFFF"/>
                </linearGradient>

                <!-- Card 3 Purple Gradient Header -->
                <linearGradient id="m3Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#F5F3FF"/>
                    <stop offset="100%" stop-color="#FFFFFF"/>
                </linearGradient>

                <!-- Soft Drop Shadows -->
                <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
                    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
                </filter>
            </defs>

            <!-- CANVAS BACKGROUND (FigJam Grid Style) -->
            <rect width="100%" height="100%" fill="#F8F9FA" rx="16"/>
            <pattern id="figjam-grid" width="24" height="24" patternUnits="userSpaceOnUse">
                <circle cx="12" cy="12" r="1" fill="#E2E8F0"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#figjam-grid)" rx="16"/>

            <!-- HEADER BANNER INSIDE SVG -->
            <g transform="translate(50, 45)">
                <!-- FigJam Title Tag -->
                <rect x="0" y="0" width="460" height="42" rx="12" fill="#1E293B"/>
                <text x="20" y="27" fill="#FFFFFF" font-size="17" font-weight="800" letter-spacing="0.5">PROGRESSIVE MILESTONE TIMELINE</text>
                
                <rect x="472" y="0" width="130" height="42" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
                <text x="537" y="26" text-anchor="middle" fill="#4338CA" font-size="13" font-weight="700">3 PHASES</text>

                <!-- Subtitle sticky note badge -->
                <g transform="translate(870, -10)">
                    <rect x="0" y="0" width="180" height="54" rx="8" fill="#FEF08A" stroke="#FDE047" stroke-width="1" transform="rotate(3)"/>
                    <text x="90" y="24" text-anchor="middle" fill="#854D0E" font-size="12" font-weight="700" transform="rotate(3)">FigJam Roadmap</text>
                    <text x="90" y="40" text-anchor="middle" fill="#A16207" font-size="10" font-weight="500" transform="rotate(3)">Target Schedule</text>
                </g>
            </g>

            <!-- CONNECTING FLOW PATHS (STATIC, BEHIND CARDS) -->
            <!-- Path M1 -> M2 -->
            <g id="flow-path-1">
                <path d="M 330 330 C 370 330, 390 490, 440 490 C 470 490, 480 340, 500 330" fill="none" stroke="url(#gradPath1)" stroke-width="6" stroke-linecap="round"/>
            </g>

            <!-- Path M2 -> M3 -->
            <g id="flow-path-2">
                <path d="M 680 330 C 720 330, 740 490, 790 490 C 820 490, 830 340, 850 330" fill="none" stroke="url(#gradPath2)" stroke-width="6" stroke-linecap="round"/>
            </g>

            <!-- Floating Flow Indicator Pill 1 -->
            <g transform="translate(390, 465)">
                <rect x="0" y="0" width="100" height="26" rx="13" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
                <text x="50" y="17" text-anchor="middle" fill="#1D4ED8" font-size="10" font-weight="700">NEXT STAGE ►</text>
            </g>

            <!-- Floating Flow Indicator Pill 2 -->
            <g transform="translate(740, 465)">
                <rect x="0" y="0" width="100" height="26" rx="13" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
                <text x="50" y="17" text-anchor="middle" fill="#6D28D9" font-size="10" font-weight="700">FINAL STAGE ►</text>
            </g>


            <!-- ================= MILESTONE CARD 1 ================= -->
            <g id="card-m1" transform="translate(50, 130)" class="transition-all duration-300">
                <!-- Card Container Frame -->
                <rect x="0" y="0" width="310" height="520" rx="20" fill="url(#m1Gradient)" stroke="#BFDBFE" stroke-width="2" filter="url(#cardShadow)"/>
                
                <!-- Status Header Pill -->
                <g transform="translate(20, 20)">
                    <rect x="0" y="0" width="115" height="30" rx="15" fill="#DBEAFE"/>
                    <circle cx="15" cy="15" r="5" fill="#2563EB"/>
                    <text x="28" y="20" fill="#1E40AF" font-size="11" font-weight="700" letter-spacing="0.5">MILESTONE 1</text>
                </g>

                <!-- Status Badge -->
                <g transform="translate(200, 18)">
                    <rect x="0" y="0" width="90" height="30" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
                    <text x="45" y="19" text-anchor="middle" fill="#166534" font-size="11" font-weight="700">✓ Phase 1</text>
                </g>

                <!-- Card Icon Header -->
                <g transform="translate(20, 70)">
                    <circle cx="28" cy="28" r="28" fill="#3B82F6"/>
                    <!-- Cloud / Download Icon -->
                    <path d="M 28 18 V 32 M 22 26 L 28 32 L 34 26 M 18 34 H 38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </g>

                <!-- Title & Description -->
                <text x="20" y="152" fill="#0F172A" font-size="17" font-weight="800">App Installer &amp; Launcher</text>
                <text x="20" y="175" fill="#2563EB" font-size="13" font-weight="700">Made Available to Clients</text>
                <line x1="20" y1="192" x2="290" y2="192" stroke="#E2E8F0" stroke-width="1.5"/>

                <!-- Description / Key Tasks -->
                <g transform="translate(20, 212)">
                    <circle cx="8" cy="8" r="4" fill="#3B82F6"/>
                    <text x="22" y="12" fill="#334155" font-size="12" font-weight="600">Client-ready installation pkg</text>
                    
                    <circle cx="8" cy="40" r="4" fill="#3B82F6"/>
                    <text x="22" y="44" fill="#334155" font-size="12" font-weight="600">New launcher download portal</text>

                    <circle cx="8" cy="72" r="4" fill="#3B82F6"/>
                    <text x="22" y="76" fill="#334155" font-size="12" font-weight="600">Deployment guides distributed</text>
                </g>

                <!-- Date Completed Placeholder Box -->
                <g transform="translate(20, 325)">
                    <rect x="0" y="0" width="270" height="48" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 3"/>
                    <text x="14" y="20" fill="#64748B" font-size="10" font-weight="700" letter-spacing="0.5">DATE COMPLETED</text>
                    <text x="14" y="37" fill="#1E40AF" font-size="13" font-weight="700">YYYY - MM - DD</text>
                </g>

                <!-- Progress Bar Section -->
                <g transform="translate(20, 390)">
                    <rect x="0" y="0" width="270" height="60" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
                    <text x="16" y="24" fill="#64748B" font-size="10" font-weight="600">PROGRESS</text>
                    <text x="254" y="24" text-anchor="end" fill="#2563EB" font-size="12" font-weight="800">100%</text>
                    
                    <rect x="16" y="34" width="238" height="8" rx="4" fill="#E2E8F0"/>
                    <rect x="16" y="34" width="238" height="8" rx="4" fill="#3B82F6"/>
                </g>

                <!-- Footer Tag -->
                <g transform="translate(20, 466)">
                    <rect x="0" y="0" width="270" height="34" rx="8" fill="#EFF6FF"/>
                    <text x="135" y="21" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="600">🚀 Available on Client Portal</text>
                </g>
            </g>


            <!-- ================= MILESTONE CARD 2 ================= -->
            <g id="card-m2" transform="translate(420, 130)" class="transition-all duration-300">
                <!-- Card Container Frame -->
                <rect x="0" y="0" width="310" height="520" rx="20" fill="url(#m2Gradient)" stroke="#A7F3D0" stroke-width="2" filter="url(#cardShadow)"/>
                
                <!-- Status Header Pill -->
                <g transform="translate(20, 20)">
                    <rect x="0" y="0" width="115" height="30" rx="15" fill="#D1FAE5"/>
                    <circle cx="15" cy="15" r="5" fill="#059669"/>
                    <text x="28" y="20" fill="#065F46" font-size="11" font-weight="700" letter-spacing="0.5">MILESTONE 2</text>
                </g>

                <!-- Status Badge -->
                <g transform="translate(200, 18)">
                    <rect x="0" y="0" width="90" height="30" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
                    <text x="45" y="19" text-anchor="middle" fill="#047857" font-size="11" font-weight="800">● Phase 2</text>
                </g>

                <!-- Card Icon Header -->
                <g transform="translate(20, 70)">
                    <circle cx="28" cy="28" r="28" fill="#10B981"/>
                    <!-- Users / Decommission Shield Icon -->
                    <path d="M 20 34 C 20 28, 24 26, 28 26 C 32 26, 36 28, 36 34 M 28 22 A 4 4 0 1 0 28 14 A 4 4 0 1 0 28 22 Z" stroke="#FFFFFF" stroke-width="2.3" fill="none" stroke-linecap="round"/>
                    <path d="M 33 22 L 39 22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                </g>

                <!-- Title & Description -->
                <text x="20" y="152" fill="#0F172A" font-size="17" font-weight="800">Full Client Adoption &amp;</text>
                <text x="20" y="175" fill="#059669" font-size="13" font-weight="700">Old Launcher Retirement</text>
                <line x1="20" y1="192" x2="290" y2="192" stroke="#E2E8F0" stroke-width="1.5"/>

                <!-- Description / Key Tasks -->
                <g transform="translate(20, 212)">
                    <circle cx="8" cy="8" r="4" fill="#10B981"/>
                    <text x="22" y="12" fill="#334155" font-size="12" font-weight="600">All clients deployed new App</text>
                    
                    <circle cx="8" cy="40" r="4" fill="#10B981"/>
                    <text x="22" y="44" fill="#334155" font-size="12" font-weight="600">App available to all users</text>

                    <circle cx="8" cy="72" r="4" fill="#10B981"/>
                    <text x="22" y="76" fill="#0F172A" font-size="12" font-weight="700">Zero active old launcher users</text>
                </g>

                <!-- Date Completed Placeholder Box -->
                <g transform="translate(20, 325)">
                    <rect x="0" y="0" width="270" height="48" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="4 3"/>
                    <text x="14" y="20" fill="#64748B" font-size="10" font-weight="700" letter-spacing="0.5">DATE COMPLETED</text>
                    <text x="14" y="37" fill="#047857" font-size="13" font-weight="700">YYYY - MM - DD</text>
                </g>

                <!-- Progress Bar Section -->
                <g transform="translate(20, 390)">
                    <rect x="0" y="0" width="270" height="60" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
                    <text x="16" y="24" fill="#64748B" font-size="10" font-weight="600">ADOPTION RATE</text>
                    <text x="254" y="24" text-anchor="end" fill="#059669" font-size="12" font-weight="800">Pending</text>
                    
                    <rect x="16" y="34" width="238" height="8" rx="4" fill="#E2E8F0"/>
                    <rect x="16" y="34" width="160" height="8" rx="4" fill="#10B981"/>
                </g>

                <!-- Footer Tag -->
                <g transform="translate(20, 466)">
                    <rect x="0" y="0" width="270" height="34" rx="8" fill="#ECFDF5"/>
                    <text x="135" y="21" text-anchor="middle" fill="#047857" font-size="11" font-weight="600">⚠️ Old Launcher Phase-Out Active</text>
                </g>
            </g>


            <!-- ================= MILESTONE CARD 3 ================= -->
            <g id="card-m3" transform="translate(790, 130)" class="transition-all duration-300">
                <!-- Card Container Frame -->
                <rect x="0" y="0" width="310" height="520" rx="20" fill="url(#m3Gradient)" stroke="#DDD6FE" stroke-width="2" filter="url(#cardShadow)"/>
                
                <!-- Status Header Pill -->
                <g transform="translate(20, 20)">
                    <rect x="0" y="0" width="115" height="30" rx="15" fill="#EDE9FE"/>
                    <circle cx="15" cy="15" r="5" fill="#7C3AED"/>
                    <text x="28" y="20" fill="#5B21B6" font-size="11" font-weight="700" letter-spacing="0.5">MILESTONE 3</text>
                </g>

                <!-- Status Badge -->
                <g transform="translate(200, 18)">
                    <rect x="0" y="0" width="90" height="30" rx="8" fill="#F3E8FF" stroke="#C084FC" stroke-width="1"/>
                    <text x="45" y="19" text-anchor="middle" fill="#6B21A8" font-size="11" font-weight="700">⏳ Phase 3</text>
                </g>

                <!-- Card Icon Header -->
                <g transform="translate(20, 70)">
                    <circle cx="28" cy="28" r="28" fill="#8B5CF6"/>
                    <!-- Security Lock Icon -->
                    <rect x="19" y="25" width="18" height="13" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2.3"/>
                    <path d="M 23 25 V 20 A 5 5 0 0 1 33 20 V 25" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round"/>
                </g>

                <!-- Title & Description -->
                <text x="20" y="152" fill="#0F172A" font-size="17" font-weight="800">Switch to Standard</text>
                <text x="20" y="175" fill="#7C3AED" font-size="13" font-weight="700">Based Authentication</text>
                <line x1="20" y1="192" x2="290" y2="192" stroke="#E2E8F0" stroke-width="1.5"/>

                <!-- Description / Key Tasks -->
                <g transform="translate(20, 212)">
                    <circle cx="8" cy="8" r="4" fill="#8B5CF6"/>
                    <text x="22" y="12" fill="#334155" font-size="12" font-weight="600">Deprecate old style auth</text>
                    
                    <circle cx="8" cy="40" r="4" fill="#8B5CF6"/>
                    <text x="22" y="44" fill="#334155" font-size="12" font-weight="600">Enable OAuth2 / OIDC standard</text>

                    <circle cx="8" cy="72" r="4" fill="#8B5CF6"/>
                    <text x="22" y="76" fill="#334155" font-size="12" font-weight="600">Enforce enterprise SSO security</text>
                </g>

                <!-- Date Completed Placeholder Box -->
                <g transform="translate(20, 325)">
                    <rect x="0" y="0" width="270" height="48" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4 3"/>
                    <text x="14" y="20" fill="#64748B" font-size="10" font-weight="700" letter-spacing="0.5">DATE COMPLETED</text>
                    <text x="14" y="37" fill="#6D28D9" font-size="13" font-weight="700">YYYY - MM - DD</text>
                </g>

                <!-- Progress Bar Section -->
                <g transform="translate(20, 390)">
                    <rect x="0" y="0" width="270" height="60" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
                    <text x="16" y="24" fill="#64748B" font-size="10" font-weight="600">AUTH MIGRATION</text>
                    <text x="254" y="24" text-anchor="end" fill="#7C3AED" font-size="12" font-weight="800">Upcoming</text>
                    
                    <rect x="16" y="34" width="238" height="8" rx="4" fill="#E2E8F0"/>
                    <rect x="16" y="34" width="60" height="8" rx="4" fill="#8B5CF6"/>
                </g>

                <!-- Footer Tag -->
                <g transform="translate(20, 466)">
                    <rect x="0" y="0" width="270" height="34" rx="8" fill="#F5F3FF"/>
                    <text x="135" y="21" text-anchor="middle" fill="#6D28D9" font-size="11" font-weight="600">🔒 Final Security Cutover Target</text>
                </g>
            </g>

            <!-- FOOTER LEGEND / ANNOTATIONS -->
            <g transform="translate(50, 670)">
                <circle cx="10" cy="0" r="5" fill="#3B82F6"/>
                <text x="22" y="4" fill="#64748B" font-size="12" font-weight="600">Phase 1: App Release</text>

                <circle cx="210" cy="0" r="5" fill="#10B981"/>
                <text x="222" y="4" fill="#64748B" font-size="12" font-weight="600">Phase 2: Client Adoption &amp; Old Launcher Cutover</text>

                <circle cx="580" cy="0" r="5" fill="#8B5CF6"/>
                <text x="592" y="4" fill="#64748B" font-size="12" font-weight="600">Phase 3: Standard Authentication Switch</text>
            </g>

        </svg>